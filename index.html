<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Janala | Best Platform to Learn English</title>
    <link rel="shortcut icon" href="./assets/logo.png" type="image/x-icon">

    <!--------------------- Font Awesome -------------------------->
    <script src="https://kit.fontawesome.com/0398fc8d82.js" crossorigin="anonymous"></script>

    <!--------------------- Daisy UI + Tailwind CSS --------------------->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-------------------------- Google Fonts --------------------->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-------------------------- Custom CSS --------------------->
    <link rel="stylesheet" href="./Style/style.css">

</head>

<body class="w-[95%] mx-auto">

    <header>
        <div class="navbar bg-base-100 shadow-sm">
            <div class="navbar-start">
                <div class="dropdown">
                    <div tabindex="0" role="button" class="btn btn-ghost lg:hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h8m-8 6h16" />
                        </svg>
                    </div>
                    <ul tabindex="-1"
                        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-1  mt-3 w-52 p-2 shadow">
                        <ul class="menu menu-horizontal px-1 flex flex-col lg:flex-row items-center gap-4">
                            <li><button class=" w-52"><img src="./assets/fa-circle-question.png" alt=""> FAQ</button>
                            </li>
                            <li><button class=" w-52"><img src="./assets/fa-book-open.png" alt="">Learn</button></li>
                            <li><button class=" w-52"><img src="./assets/fa-arrow-right-from-bracket.png"
                                        alt="">Logout</button></li>
                        </ul>
                    </ul>
                </div>
                <a class="btn btn-ghost text-xl flex items-center normal-case" href="#">
                    <span class="text-lg font-bold">English</span>
                    <img src="./assets/logo.png" alt="English Janala Logo" class="w-8 mr-2">
                    <span class="font-bangla text-lg">জানালা</span>
                </a>
            </div>
            <div class="navbar-end hidden items-center lg:flex">
                <ul class="menu menu-horizontal px-1 flex items-center gap-4">
                    <li><button class="btn btn-outline btn-primary"><img src="./assets/fa-circle-question.png" alt="">
                            FAQ</button></li>
                    <li><button class="btn btn-outline btn-primary"><img src="./assets/fa-book-open.png"
                                alt="">Learn</button></li>
                    <li><button class="btn btn-outline btn-primary"><img src="./assets/fa-arrow-right-from-bracket.png"
                                alt="">Logout</button></li>
                </ul>
            </div>
        </div>
    </header>

    <!-------------------------- Banner Content --------------------->

    <section class="flex flex-row items-center justify-between max-sm:flex-col mt-10 gap-10">
        <div class="left flex flex-col items-start">
            <h1 class="text-5xl font-bold max-sm:text-3xl"><span class="text-[#00BCFF]">English</span> is Easy</h1>
            <p class="text-2xl max-sm:text-lg mt-5">আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা
                <br class="max-sm:hidden"> আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে <br
                    class="max-sm:hidden"> যাবে অন্য একটি Level এ</p>
            <input type="text" placeholder="Enter Your Name" class="input input-bordered w-full max-w-xs mt-5">
            <input type="password" placeholder="Enter Password" class="input input-bordered w-full max-w-xs mt-5">
            <button class="btn btn-primary mt-5">Get Started</button>
        </div>

        <div class="right">
            <img class="max-sm:hidden" src="./assets/hero-student.png" alt="Hero Image">
        </div>
    </section>


    <!-------------------------- Vocabulary Content --------------------->

    <section class="mt-6 mx-auto w-full max-w-5xl">
        <h2 class="text-4xl text-center font-bold max-sm:text-3xl"><span class="text-[#00BCFF]">Let's</span> Learn
            Vocabularies</h2>

        <div id="level-container" class="mt-8 mb-5 flex flex-wrap justify-center gap-6">

        </div>
    </section>

    <!-------------------------- Word Container --------------------->

    <section id="word-container" class="bg-gray-300 grid grid-cols-3 gap-5 py-10 w-11/12 mx-auto my-10">

        

    </section>


    <script src="./scripts/index.js"></script>
</body>

</html>
